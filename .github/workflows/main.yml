name: Build PaisaFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Money Manager ZIP
        run: |
          echo "Searching for project ZIP..."
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository"
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "Extracted project files:"
          find project -maxdepth 4 -type f | head -100

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Gradle Project
        run: |
          SETTINGS_FILE=$(find project -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find project -type f \( \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' \
            \) | head -n 1)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: Gradle project files not found inside ZIP"
              find project -maxdepth 5 -type f
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found at: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR" -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp "$APK" apk-output/PaisaFlow-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaisaFlow-debug-apk
          path: apk-output/PaisaFlow-debug.apk
          if-no-files-found: error
