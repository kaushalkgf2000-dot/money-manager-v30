name: Build PaisaFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' -print)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -eq 1 ]; then
            ZIP_FILE="${ZIPS[0]}"
          else
            ZIP_FILE=$(printf '%s\n' "${ZIPS[@]}" | grep -i 'PaisaFlow' | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Multiple ZIP files found. Keep only the project ZIP."
              printf '%s\n' "${ZIPS[@]}"
              exit 1
            fi
          fi

          echo "Using project ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Gradle Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found inside ZIP."
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f -name 'app-debug.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/PaisaFlow-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaisaFlow-debug-apk
          path: apk-output/PaisaFlow-debug.apk
          if-no-files-found: error
